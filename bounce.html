<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wasm AssemblyScript Canvas</title>
    <style>
        body {
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        canvas {
            border: 2px solid #555;
        }
    </style>
</head>

<body>

    <canvas id="canvas" width="100" height="100"></canvas>

    <script src="./wasm_exec.js"></script>
    <script type="module">
        const width = 1000;
        const height = 800;
        const totalBytes = width * height * 4;
        const response = await fetch('./dist/bounce.wasm');
        const buffer = await response.arrayBuffer();
        
        const go = new Go();
        const wasmModule = await WebAssembly.instantiate(buffer, go.importObject);

        // Extract our functions and the raw Wasm memory
        const { updateAndRender, getBufferPointer, memory } = wasmModule.instance.exports;

        const canvas = document.getElementById('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(width, height);

       go.run(wasmModule.instance);

        const bufferPointer = getBufferPointer();

        let lastTimestamp = performance.now();
        const loop = () => {
            const timestamp = performance.now();
            //console.log("Time between: " + (timestamp - lastTimestamp) / 1000);
            updateAndRender((timestamp - lastTimestamp) / 1000);
            console.log("Render delay", performance.now() - timestamp, "ms");

            const wasmBuffer = new Uint8ClampedArray(memory.buffer, bufferPointer, totalBytes);

            imageData.data.set(wasmBuffer);
            ctx.putImageData(imageData, 0, 0);
            lastTimestamp = timestamp;
            requestAnimationFrame(loop);
        };
        
        loop();
    </script>
</body>

</html>
